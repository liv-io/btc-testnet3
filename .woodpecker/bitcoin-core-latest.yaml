when:
  - path:
      include:
        - '.woodpecker/bitcoin-core-latest.yaml'
        - 'apps/bitcoin-core/**'

clone:
  - name: git
    image: woodpeckerci/plugin-git
    volumes:
      - custom-ca-certs:/etc/ssl/certs/custom:ro
    settings:
      custom_ssl_path: /etc/ssl/certs/custom/ca1.liv.io.crt

steps:
  - name: lint
    image: code.liv.io/liv/k8s-ops:1.37.1-1
    environment:
      KUBECONFIG_DATA:
        from_secret: bitcoin-core-deployer
      RPCPASS:
        from_secret: bitcoin-core_rpcpass
      SSH_KEY:
        from_secret: code_container_ssh
    commands:
      - /cmd.sh

      - install --directory --owner=k8s --group=k8s --mode=0700 ~/.ssh
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.ssh/id_ed25519
      - echo "$${SSH_KEY}" > ~/.ssh/id_ed25519
      - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic bitcoin-core-secrets
        --namespace=bitcoin-core
        --from-literal=RPCPASS="$${RPCPASS}"
        --dry-run=client -o yaml | kubectl apply --dry-run=client -f -

      - kubectl apply -k ./apps/bitcoin-core/overlays/latest/ --dry-run=client
      - kubectl apply -k ./apps/bitcoin-core/overlays/latest/ --dry-run=server

  - name: deploy
    image: code.liv.io/liv/k8s-ops:1.37.1-1
    environment:
      KUBECONFIG_DATA:
        from_secret: bitcoin-core-deployer
      RPCPASS:
        from_secret: bitcoin-core_rpcpass
      SSH_KEY:
        from_secret: code_container_ssh
    when:
      - event: push
        branch: main
    commands:
      - /cmd.sh

      - install --directory --owner=k8s --group=k8s --mode=0700 ~/.ssh
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.ssh/id_ed25519
      - echo "$${SSH_KEY}" > ~/.ssh/id_ed25519
      - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic bitcoin-core-secrets
        --namespace=bitcoin-core
        --from-literal=RPCPASS="$${RPCPASS}"
        --dry-run=client -o yaml | kubectl apply -f -

      - kubectl apply -k ./apps/bitcoin-core/overlays/latest/
      - kubectl rollout status -n bitcoin-core deployment/bitcoin-core-latest --timeout=90s
      - kubectl get deployment bitcoin-core-latest -n bitcoin-core -o jsonpath='{.spec.template.spec.containers[*].image}'

labels:
  platform: linux/amd64

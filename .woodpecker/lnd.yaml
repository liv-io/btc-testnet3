when:
  - path:
      include:
        - '.woodpecker/lnd.yaml'
        - 'apps/lnd/**'

clone:
  - name: git
    image: woodpeckerci/plugin-git
    volumes:
      - custom-ca-certs:/etc/ssl/certs/custom:ro
    settings:
      custom_ssl_path: /etc/ssl/certs/custom/ca1.liv.io.crt

steps:
  - name: lint
    image: code.liv.io/liv/k8s-ops:1.37.1-1
    environment:
      KUBECONFIG_DATA:
        from_secret: lnd-deployer
      BITCOIND_RPCPASS:
        from_secret: lnd_bitcoind_rpcpass
      WALLET_PASSWORD:
        from_secret: lnd_wallet_password
      SSH_KEY:
        from_secret: code_container_ssh
    commands:
      - /cmd.sh

      - install --directory --owner=k8s --group=k8s --mode=0700 ~/.ssh
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.ssh/id_ed25519
      - echo "$${SSH_KEY}" > ~/.ssh/id_ed25519
      - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic lnd-secrets
        --namespace=lnd
        --from-literal=BITCOIND_RPCPASS="$${BITCOIND_RPCPASS}"
        --from-literal=WALLET_PASSWORD="$${WALLET_PASSWORD}"
        --dry-run=client -o yaml | kubectl apply --dry-run=client -f -

      - kubectl apply -k ./apps/lnd/ --dry-run=client
      - kubectl apply -k ./apps/lnd/ --dry-run=server

  - name: deploy
    image: code.liv.io/liv/k8s-ops:1.37.1-1
    environment:
      KUBECONFIG_DATA:
        from_secret: lnd-deployer
      BITCOIND_RPCPASS:
        from_secret: lnd_bitcoind_rpcpass
      WALLET_PASSWORD:
        from_secret: lnd_wallet_password
      SSH_KEY:
        from_secret: code_container_ssh
    when:
      - event: push
        branch: main
    commands:
      - /cmd.sh

      - install --directory --owner=k8s --group=k8s --mode=0700 ~/.ssh
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.ssh/id_ed25519
      - echo "$${SSH_KEY}" > ~/.ssh/id_ed25519
      - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic lnd-secrets
        --namespace=lnd
        --from-literal=BITCOIND_RPCPASS="$${BITCOIND_RPCPASS}"
        --from-literal=WALLET_PASSWORD="$${WALLET_PASSWORD}"
        --dry-run=client -o yaml | kubectl apply -f -

      - kubectl apply -k ./apps/lnd/
      - kubectl rollout status -n lnd deployment/lnd --timeout=90s
      - kubectl get deployment lnd -n lnd -o jsonpath='{.spec.template.spec.containers[*].image}'

labels:
  platform: linux/amd64

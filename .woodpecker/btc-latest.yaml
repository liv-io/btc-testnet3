when:
  - path:
      include:
        - '.woodpecker/btc-latest.yaml'
        - 'apps/btc/base/**'
        - 'apps/btc/overlays/latest/**'

clone:
  - name: git
    image: woodpeckerci/plugin-git
    volumes:
      - custom-ca-certs:/etc/ssl/certs/custom:ro
    settings:
      custom_ssl_path: /etc/ssl/certs/custom/ca1.liv.io.crt

steps:
  - name: lint
    image: code.liv.io/liv/k8s-ops:1.36.2-2
    environment:
      KUBECONFIG_DATA:
        from_secret: btc-deployer
      RPCPASS:
        from_secret: btc_rpcpass
    commands:
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic btc-secrets
        --namespace=btc
        --from-literal=RPCPASS="$${RPCPASS}"
        --dry-run=client -o yaml | kubectl apply --dry-run=client -f -

      - kubectl apply -k ./apps/btc/overlays/latest/ --dry-run=client
      - kubectl apply -k ./apps/btc/overlays/latest/ --dry-run=server

  - name: deploy
    image: code.liv.io/liv/k8s-ops:1.36.2-2
    environment:
      KUBECONFIG_DATA:
        from_secret: btc-deployer
      RPCPASS:
        from_secret: btc_rpcpass
    when:
      - event: push
        branch: main
    commands:
      - install --owner=k8s --group=k8s --mode=0600 /dev/null ~/.kubeconfig
      - echo "$${KUBECONFIG_DATA}" > ~/.kubeconfig
      - export KUBECONFIG=~/.kubeconfig

      - >-
        kubectl create secret generic btc-secrets
        --namespace=btc
        --from-literal=RPCPASS="$${RPCPASS}"
        --dry-run=client -o yaml | kubectl apply -f -

      - kubectl apply -k ./apps/btc/overlays/latest/
      - kubectl rollout status -n btc deployment/btc-latest --timeout=90s
      - kubectl get deployment btc-latest -n btc -o jsonpath='{.spec.template.spec.containers[*].image}'

labels:
  platform: linux/amd64

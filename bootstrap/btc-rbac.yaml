apiVersion: v1
kind: ServiceAccount

metadata:
  name: btc-deployer
  namespace: btc

---

apiVersion: v1
kind: Secret

metadata:
  name: btc-deployer-token
  namespace: btc
  annotations:
    kubernetes.io/service-account.name: btc-deployer

type: kubernetes.io/service-account-token

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: btc-deployer-binding
  namespace: btc

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin

subjects:
  - kind: ServiceAccount
    name: btc-deployer
    namespace: btc

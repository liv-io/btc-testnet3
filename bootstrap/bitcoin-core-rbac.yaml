apiVersion: v1
kind: ServiceAccount

metadata:
  name: bitcoin-core-deployer
  namespace: bitcoin-core

---

apiVersion: v1
kind: Secret

metadata:
  name: bitcoin-core-deployer-token
  namespace: bitcoin-core
  annotations:
    kubernetes.io/service-account.name: bitcoin-core-deployer

type: kubernetes.io/service-account-token

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: bitcoin-core-deployer-binding
  namespace: bitcoin-core

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin

subjects:
  - kind: ServiceAccount
    name: bitcoin-core-deployer
    namespace: bitcoin-core
